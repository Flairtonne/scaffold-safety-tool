<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OSHA Direct Access Safety Verifier</title>
  <style>
    :root {
      --bg: #0b1329;
      --card-bg: #111a33;
      --accent-cyan: #00d2ff;
      --accent-orange: #ff9f43;
      --success: #2ec4b6;
      --danger: #e71d36;
      --text: #e0e6ed;
      --text-muted: #8d99ae;
      --grid: rgba(255, 255, 255, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; }
    
    .container {
      width: 100%;
      max-width: 800px;
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .header {
      padding: 15px 20px;
      background: rgba(0,0,0,0.2);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .header h2 { font-size: 1rem; color: var(--text-muted); font-weight: 500; }
    .header .rule-tag { color: var(--accent-cyan); font-size: 0.85rem; font-weight: 600; }

    /* Canvas / Graphic Area */
    .viewport {
      position: relative;
      height: 320px;
      background-color: #0d162d;
      background-image: 
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 20px 20px;
      overflow: hidden;
    }

    svg { width: 100%; height: 100%; }

    /* Status Dashboard */
    .dashboard {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 15px 20px;
      background: rgba(0,0,0,0.3);
      border-top: 1px solid rgba(255,255,255,0.05);
      text-align: center;
    }

    .stat-box .label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; }
    .stat-box .value { font-size: 1.1rem; font-weight: bold; }
    .stat-box .value.safe { color: var(--success); }
    .stat-box .value.violation { color: var(--danger); }

    /* Controls Panel */
    .controls { padding: 20px; display: grid; gap: 15px; }
    .preset-btns { display: flex; gap: 10px; margin-bottom: 5px; }
    
    button {
      flex: 1;
      padding: 8px 12px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    button:hover { background: rgba(255,255,255,0.15); }

    .slider-group { display: flex; flex-direction: column; gap: 5px; }
    .slider-header { display: flex; justify-content: space-between; font-size: 0.85rem; }
    input[type=range] { width: 100%; accent-color: var(--accent-cyan); }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h2>Direct Access Verification Tool</h2>
    <span class="rule-tag">OSHA 1926.451(e)(8)</span>
  </div>

  <div class="viewport">
    <svg id="diagram" viewBox="0 0 600 300">
      <!-- Ground Line -->
      <line x1="20" y1="260" x2="580" y2="260" stroke="#3a4b6e" stroke-dasharray="4" stroke-width="2"/>
      
      <!-- Interior Floor Structure -->
      <rect x="50" y="110" width="180" height="150" fill="#112240" stroke="#00d2ff" stroke-width="2"/>
      <text x="60" y="130" fill="#8d99ae" font-size="12">Interior Floor Face</text>
      <text x="60" y="250" fill="#3a4b6e" font-size="11">Ground Level</text>

      <!-- Scaffold Frame -->
      <g id="scaffold-frame">
        <!-- Vertical standards -->
        <line id="scaff-left" x1="310" y1="100" x2="310" y2="260" stroke="#4a5d78" stroke-width="2"/>
        <line id="scaff-right" x1="470" y1="100" x2="470" y2="260" stroke="#4a5d78" stroke-width="2"/>
        <!-- Cross bracing -->
        <line id="brace1" x1="310" y1="160" x2="470" y2="260" stroke="#2c3a4e" stroke-width="1.5"/>
        <line id="brace2" x1="470" y1="160" x2="310" y2="260" stroke="#2c3a4e" stroke-width="1.5"/>
        <!-- Platform plank -->
        <rect id="platform" x="305" y="160" width="170" height="12" fill="#ff9f43" rx="2"/>
        <text id="scaff-label" x="340" y="188" fill="#ff9f43" font-size="11">Scaffold Platform Face</text>
      </g>

      <!-- Dimension Lines & Arrows -->
      <!-- Horizontal Gap Line -->
      <g id="h-gap-group">
        <line x1="230" y1="80" x2="310" y2="80" stroke="#00d2ff" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
        <text id="h-text" x="240" y="72" fill="#00d2ff" font-size="11" font-weight="bold">Horizontal Gap: 8"</text>
        <text id="h-status" x="240" y="95" fill="#2ec4b6" font-size="10">Compliant (≤14")</text>
      </g>

      <!-- Vertical Gap Line -->
      <g id="v-gap-group">
        <line x1="350" y1="110" x2="350" y2="160" stroke="#2ec4b6" stroke-width="1.5"/>
        <text id="v-text" x="360" y="130" fill="#2ec4b6" font-size="11" font-weight="bold">Vertical Gap: 14"</text>
        <text id="v-status" x="360" y="145" fill="#2ec4b6" font-size="10">Compliant (≤24")</text>
      </g>

      <!-- Arrow Marker Definition -->
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#00d2ff"/>
        </marker>
      </defs>
    </svg>
  </div>

  <div class="dashboard">
    <div class="stat-box">
      <div class="label">Horizontal Status</div>
      <div id="dash-h-status" class="value safe">Safe Access</div>
    </div>
    <div class="stat-box">
      <div class="label">Vertical Status</div>
      <div id="dash-v-status" class="value safe">Safe Step</div>
    </div>
    <div class="stat-box">
      <div class="label">Max Limits Allowed</div>
      <div class="value" style="color: #e0e6ed;">14" H / 24" V</div>
    </div>
  </div>

  <div class="controls">
    <div class="preset-btns">
      <button onclick="setScenario(8, 14)">Fully Compliant</button>
      <button onclick="setScenario(18, 14)">Wide Gap Violation</button>
      <button onclick="setScenario(8, 28)">High Step Violation</button>
    </div>

    <div class="slider-group">
      <div class="slider-header">
        <span>Horizontal Gap (Inches)</span>
        <b id="h-val">8"</b>
      </div>
      <input type="range" id="h-slider" min="2" max="24" value="8" oninput="updateDiagram()">
    </div>

    <div class="slider-group">
      <div class="slider-header">
        <span>Vertical Step Gap (Inches)</span>
        <b id="v-val">14"</b>
      </div>
      <input type="range" id="v-slider" min="0" max="36" value="14" oninput="updateDiagram()">
    </div>
  </div>
</div>

<script>
  function updateDiagram() {
    const hGap = parseInt(document.getElementById('h-slider').value);
    const vGap = parseInt(document.getElementById('v-slider').value);

    document.getElementById('h-val').innerText = hGap + '"';
    document.getElementById('v-val').innerText = vGap + '"';

    // SVG Element References
    const scaffLeft = 230 + (hGap * 10);
    const platformY = 110 + (vGap * 3.5);

    // Update Scaffold X Position
    document.getElementById('scaff-left').setAttribute('x1', scaffLeft);
    document.getElementById('scaff-left').setAttribute('x2', scaffLeft);
    document.getElementById('scaff-right').setAttribute('x1', scaffLeft + 160);
    document.getElementById('scaff-right').setAttribute('x2', scaffLeft + 160);

    // Update Platform Position
    document.getElementById('platform').setAttribute('x', scaffLeft - 5);
    document.getElementById('platform').setAttribute('y', platformY);
    document.getElementById('scaff-label').setAttribute('x', scaffLeft + 30);
    document.getElementById('scaff-label').setAttribute('y', platformY + 28);

    // Update Braces
    document.getElementById('brace1').setAttribute('x1', scaffLeft);
    document.getElementById('brace1').setAttribute('y1', platformY);
    document.getElementById('brace1').setAttribute('x2', scaffLeft + 160);

    document.getElementById('brace2').setAttribute('x1', scaffLeft + 160);
    document.getElementById('brace2').setAttribute('y1', platformY);
    document.getElementById('brace2').setAttribute('x2', scaffLeft);

    // Check Compliance
    const hCompliant = hGap <= 14;
    const vCompliant = vGap <= 24;

    // Update UI Text & Color Indicators
    document.getElementById('h-text').textContent = `Horizontal Gap: ${hGap}"`;
    document.getElementById('h-status').textContent = hCompliant ? 'Compliant (≤14")' : 'VIOLATION (>14")';
    document.getElementById('h-status').setAttribute('fill', hCompliant ? '#2ec4b6' : '#e71d36');

    document.getElementById('v-text').textContent = `Vertical Gap: ${vGap}"`;
    document.getElementById('v-status').textContent = vCompliant ? 'Compliant (≤24")' : 'VIOLATION (>24")';
    document.getElementById('v-status').setAttribute('fill', vCompliant ? '#2ec4b6' : '#e71d36');

    // Dashboard Updates
    const dashH = document.getElementById('dash-h-status');
    dashH.textContent = hCompliant ? 'Safe Access' : 'Gap Hazard';
    dashH.className = `value ${hCompliant ? 'safe' : 'violation'}`;

    const dashV = document.getElementById('dash-v-status');
    dashV.textContent = vCompliant ? 'Safe Step' : 'Step Hazard';
    dashV.className = `value ${vCompliant ? 'safe' : 'violation'}`;
  }

  function setScenario(h, v) {
    document.getElementById('h-slider').value = h;
    document.getElementById('v-slider').value = v;
    updateDiagram();
  }

  // Initial draw
  updateDiagram();
</script>

</body>
</html>
